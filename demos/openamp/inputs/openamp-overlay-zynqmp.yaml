# ZynqMP OpenAMP: Linux on A53-0 loads and runs both R5 cores in split mode
# (remoteproc) and talks to each over RPMsg.
#
# Written against demos/openamp/inputs/openamp_zu.dts, whose IPI channels are
# labelled psu_ipi_<agent>_<destination>: A53-0 uses IPI agent 7, R5-0 agent
# 1 and R5-1 agent 2.

reserved-memory:
    ranges: true
    "#address-cells": 2
    "#size-cells": 2

    rproc0@9800000:
        start: 0x9800000
        size: 0x60000
        no-map: 1
    rpu0vdev0vring0@9860000:
        start: 0x9860000
        size: 0x4000
        no-map: 1
    rpu0vdev0vring1@9864000:
        start: 0x9864000
        size: 0x4000
        no-map: 1
    rpu0vdev0buffer@9868000:
        start: 0x9868000
        size: 0x40000
        no-map: 1

    rproc1@9e00000:
        start: 0x9e00000
        size: 0x60000
        no-map: 1
    rpu1vdev0vring0@9e60000:
        start: 0x9e60000
        size: 0x4000
        no-map: 1
    rpu1vdev0vring1@9e64000:
        start: 0x9e64000
        size: 0x4000
        no-map: 1
    rpu1vdev0buffer@9e68000:
        start: 0x9e68000
        size: 0x40000
        no-map: 1

domains:
    openamp_a53_0_cluster:
        compatible: openamp,domain-v1
        cpus:
            - cluster: cpus_a53
              cpumask: 0x1
              mode:
                  secure: true
                  el: 0x3
        os,type: linux
        access:
            - dev: ipi7
              flags: 0
            - dev: psu_r5_0_atcm_global
              flags: 0
            - dev: psu_r5_0_btcm_global
              flags: 0
            - dev: psu_r5_1_atcm_global
              flags: 0
            - dev: psu_r5_1_btcm_global
              flags: 0
        reserved-memory:
            - rproc0@9800000
            - rpu0vdev0vring0@9860000
            - rpu0vdev0vring1@9864000
            - rpu0vdev0buffer@9868000
            - rproc1@9e00000
            - rpu1vdev0vring0@9e60000
            - rpu1vdev0vring1@9e64000
            - rpu1vdev0buffer@9e68000

        domain-to-domain:
            compatible: openamp,domain-to-domain-v1
            remoteproc-relation:
                compatible: openamp,remoteproc-v2
                relation0:
                    remote: openamp_r5_0_cluster
                    elfload: [ psu_r5_0_atcm_global, psu_r5_0_btcm_global, rproc0@9800000 ]
                relation1:
                    remote: openamp_r5_1_cluster
                    elfload: [ psu_r5_1_atcm_global, psu_r5_1_btcm_global, rproc1@9e00000 ]

            rpmsg-relation:
                compatible: openamp,rpmsg-v1
                relation0:
                    remote: openamp_r5_0_cluster
                    carveouts: [ rpu0vdev0vring0@9860000, rpu0vdev0vring1@9864000, rpu0vdev0buffer@9868000 ]
                    mbox: psu_ipi_7_1
                relation1:
                    remote: openamp_r5_1_cluster
                    carveouts: [ rpu1vdev0vring0@9e60000, rpu1vdev0vring1@9e64000, rpu1vdev0buffer@9e68000 ]
                    mbox: psu_ipi_7_2

    openamp_r5_0_cluster:
        compatible: openamp,domain-v1
        cpus:
            - cluster: cpus_r5_0
              cpumask: 0x1
              mode:
                  secure: true
        os,type: baremetal
        access:
            - dev: ipi1
              flags: 0
            - dev: psu_r5_0_atcm_global
              flags: 0
            - dev: psu_r5_0_btcm_global
              flags: 0
        reserved-memory:
            - rproc0@9800000
            - rpu0vdev0vring0@9860000
            - rpu0vdev0vring1@9864000
            - rpu0vdev0buffer@9868000

        domain-to-domain:
            compatible: openamp,domain-to-domain-v1
            rpmsg-relation:
                compatible: openamp,rpmsg-v1
                relation0:
                    host: openamp_a53_0_cluster
                    carveouts: [ rpu0vdev0vring0@9860000, rpu0vdev0vring1@9864000, rpu0vdev0buffer@9868000 ]
                    mbox: psu_ipi_1_7

    openamp_r5_1_cluster:
        compatible: openamp,domain-v1
        cpus:
            - cluster: cpus_r5_1
              cpumask: 0x1
              mode:
                  secure: true
        os,type: baremetal
        access:
            - dev: ipi2
              flags: 0
            - dev: psu_r5_1_atcm_global
              flags: 0
            - dev: psu_r5_1_btcm_global
              flags: 0
        reserved-memory:
            - rproc1@9e00000
            - rpu1vdev0vring0@9e60000
            - rpu1vdev0vring1@9e64000
            - rpu1vdev0buffer@9e68000

        domain-to-domain:
            compatible: openamp,domain-to-domain-v1
            rpmsg-relation:
                compatible: openamp,rpmsg-v1
                relation0:
                    host: openamp_a53_0_cluster
                    carveouts: [ rpu1vdev0vring0@9e60000, rpu1vdev0vring1@9e64000, rpu1vdev0buffer@9e68000 ]
                    mbox: psu_ipi_2_7
