# ZynqMP OpenAMP: Linux on A53-0 loads and runs the R5 cluster in lockstep
# (remoteproc) and talks to it over RPMsg.
#
# In lockstep the cluster runs on core 0 and its firmware can use both
# cores' TCM: core 0's banks and the second pair the SDT labels
# psu_r5_0_{a,b}tcm_lockstep.
#
# Written against demos/openamp/inputs/openamp_zu.dts, whose IPI channels are
# labelled psu_ipi_<agent>_<destination>: A53-0 uses IPI agent 7 and the R5
# cluster agent 1.

reserved-memory:
    ranges: true
    "#address-cells": 2
    "#size-cells": 2

    rproc0@3ed00000:
        start: 0x3ed00000
        size: 0x60000
        no-map: 1
    rpu0vdev0vring0@3ed60000:
        start: 0x3ed60000
        size: 0x4000
        no-map: 1
    rpu0vdev0vring1@3ed64000:
        start: 0x3ed64000
        size: 0x4000
        no-map: 1
    rpu0vdev0buffer@3ed68000:
        start: 0x3ed68000
        size: 0x40000
        no-map: 1

domains:
    openamp_a53_0_cluster:
        compatible: openamp,domain-v1
        cpus:
            - cluster: cpus_a53
              cpumask: 0x1
              mode:
                  secure: true
                  el: 0x3
        os,type: linux
        access:
            - dev: ipi7
              flags: 0
            - dev: psu_r5_0_atcm_global
              flags: 0
            - dev: psu_r5_0_btcm_global
              flags: 0
            - dev: psu_r5_0_atcm_lockstep
              flags: 0
            - dev: psu_r5_0_btcm_lockstep
              flags: 0
        reserved-memory:
            - rproc0@3ed00000
            - rpu0vdev0vring0@3ed60000
            - rpu0vdev0vring1@3ed64000
            - rpu0vdev0buffer@3ed68000

        domain-to-domain:
            compatible: openamp,domain-to-domain-v1
            remoteproc-relation:
                compatible: openamp,remoteproc-v2
                relation0:
                    remote: openamp_r5_lockstep
                    elfload: [ psu_r5_0_atcm_global, psu_r5_0_btcm_global,
                               psu_r5_0_atcm_lockstep, psu_r5_0_btcm_lockstep,
                               rproc0@3ed00000 ]

            rpmsg-relation:
                compatible: openamp,rpmsg-v1
                relation0:
                    remote: openamp_r5_lockstep
                    carveouts: [ rpu0vdev0vring0@3ed60000, rpu0vdev0vring1@3ed64000, rpu0vdev0buffer@3ed68000 ]
                    mbox: psu_ipi_7_1

    openamp_r5_lockstep:
        compatible: openamp,domain-v1
        cpus:
            - cluster: cpus_r5_0
              cpumask: 0x1
              mode:
                  secure: true
                  lockstep: true
        os,type: baremetal
        access:
            - dev: ipi1
              flags: 0
            - dev: psu_r5_0_atcm_global
              flags: 0
            - dev: psu_r5_0_btcm_global
              flags: 0
            - dev: psu_r5_0_atcm_lockstep
              flags: 0
            - dev: psu_r5_0_btcm_lockstep
              flags: 0
        reserved-memory:
            - rproc0@3ed00000
            - rpu0vdev0vring0@3ed60000
            - rpu0vdev0vring1@3ed64000
            - rpu0vdev0buffer@3ed68000

        domain-to-domain:
            compatible: openamp,domain-to-domain-v1
            rpmsg-relation:
                compatible: openamp,rpmsg-v1
                relation0:
                    host: openamp_a53_0_cluster
                    carveouts: [ rpu0vdev0vring0@3ed60000, rpu0vdev0vring1@3ed64000, rpu0vdev0buffer@3ed68000 ]
                    mbox: psu_ipi_1_7
