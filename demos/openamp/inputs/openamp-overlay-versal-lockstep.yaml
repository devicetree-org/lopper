# Versal OpenAMP: Linux on A72-0 loads and runs the R5 cluster in lockstep
# (remoteproc) and talks to it over RPMsg.
#
# In lockstep the cluster runs on core 0 and its firmware can use both
# cores' TCM: core 0's banks and the second pair the SDT labels
# CIPS_0_pspmc_0_psv_r5_0_{a,b}tcm_lockstep.
#
# Written against a 2026.2 VEK280 system device tree, whose IPI channels are
# labelled ipi_<agent>_to_ipi_<destination>: A72-0 uses IPI agent 3 and the
# R5 cluster agent 1. The in-tree openamp_versal.dts does not label its IPI
# channels, so this overlay cannot name them there.

reserved-memory:
    ranges: true
    "#address-cells": 2
    "#size-cells": 2

    rproc0@3ed00000:
        start: 0x3ed00000
        size: 0x60000
        no-map: 1
    rpu0vdev0vring0@3ed60000:
        start: 0x3ed60000
        size: 0x4000
        no-map: 1
    rpu0vdev0vring1@3ed64000:
        start: 0x3ed64000
        size: 0x4000
        no-map: 1
    rpu0vdev0buffer@3ed68000:
        start: 0x3ed68000
        size: 0x40000
        no-map: 1

domains:
    openamp_a72_0_cluster:
        compatible: openamp,domain-v1
        cpus:
            - cluster: cpus_a72
              cpumask: 0x1
              mode:
                  secure: true
                  el: 0x3
        os,type: linux
        access:
            - dev: ipi3
              flags: 0
            - dev: psv_r5_0_atcm_global
              flags: 0
            - dev: psv_r5_0_btcm_global
              flags: 0
            - dev: CIPS_0_pspmc_0_psv_r5_0_atcm_lockstep
              flags: 0
            - dev: CIPS_0_pspmc_0_psv_r5_0_btcm_lockstep
              flags: 0
        reserved-memory:
            - rproc0@3ed00000
            - rpu0vdev0vring0@3ed60000
            - rpu0vdev0vring1@3ed64000
            - rpu0vdev0buffer@3ed68000

        domain-to-domain:
            compatible: openamp,domain-to-domain-v1
            remoteproc-relation:
                compatible: openamp,remoteproc-v2
                relation0:
                    remote: openamp_r5_lockstep
                    elfload: [ psv_r5_0_atcm_global, psv_r5_0_btcm_global,
                               CIPS_0_pspmc_0_psv_r5_0_atcm_lockstep,
                               CIPS_0_pspmc_0_psv_r5_0_btcm_lockstep,
                               rproc0@3ed00000 ]

            rpmsg-relation:
                compatible: openamp,rpmsg-v1
                relation0:
                    remote: openamp_r5_lockstep
                    carveouts: [ rpu0vdev0vring0@3ed60000, rpu0vdev0vring1@3ed64000, rpu0vdev0buffer@3ed68000 ]
                    mbox: ipi_3_to_ipi_1

    openamp_r5_lockstep:
        compatible: openamp,domain-v1
        cpus:
            - cluster: cpus_r5_0
              cpumask: 0x1
              mode:
                  secure: true
                  lockstep: true
        os,type: baremetal
        access:
            - dev: ipi1
              flags: 0
            - dev: psv_r5_0_atcm_global
              flags: 0
            - dev: psv_r5_0_btcm_global
              flags: 0
            - dev: CIPS_0_pspmc_0_psv_r5_0_atcm_lockstep
              flags: 0
            - dev: CIPS_0_pspmc_0_psv_r5_0_btcm_lockstep
              flags: 0
        reserved-memory:
            - rproc0@3ed00000
            - rpu0vdev0vring0@3ed60000
            - rpu0vdev0vring1@3ed64000
            - rpu0vdev0buffer@3ed68000

        domain-to-domain:
            compatible: openamp,domain-to-domain-v1
            rpmsg-relation:
                compatible: openamp,rpmsg-v1
                relation0:
                    host: openamp_a72_0_cluster
                    carveouts: [ rpu0vdev0vring0@3ed60000, rpu0vdev0vring1@3ed64000, rpu0vdev0buffer@3ed68000 ]
                    mbox: ipi_1_to_ipi_3
