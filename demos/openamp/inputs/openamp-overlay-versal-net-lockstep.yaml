# Versal NET OpenAMP: Linux on A78-0 loads and runs R52 cluster A in lockstep
# (remoteproc) and talks to it over RPMsg.
#
# In lockstep the cluster runs on core 0. R52 cores do not combine TCM, so
# its firmware uses core 0's banks.
#
# Written against a 2026.2 VN-P-B2197 system device tree, whose IPI channels
# are labelled ipi_<agent>_to_ipi_<destination>: A78-0 uses IPI agent 3 and
# the R52 cluster agent 1. There is no Versal NET SDT in the tree.

reserved-memory:
    ranges: true
    "#address-cells": 2
    "#size-cells": 2

    rproc0@3ed00000:
        start: 0x3ed00000
        size: 0x60000
        no-map: 1
    rpu0vdev0vring0@3ed60000:
        start: 0x3ed60000
        size: 0x4000
        no-map: 1
    rpu0vdev0vring1@3ed64000:
        start: 0x3ed64000
        size: 0x4000
        no-map: 1
    rpu0vdev0buffer@3ed68000:
        start: 0x3ed68000
        size: 0x40000
        no-map: 1

domains:
    openamp_a78_0_cluster:
        compatible: openamp,domain-v1
        cpus:
            - cluster: cpus_a78
              cpumask: 0x1
              mode:
                  secure: true
                  el: 0x3
        os,type: linux
        access:
            - dev: ipi3
              flags: 0
            - dev: psx_wizard_0_psxl_0_psx_r52_0a_atcm_global
              flags: 0
            - dev: psx_wizard_0_psxl_0_psx_r52_0a_btcm_global
              flags: 0
            - dev: psx_wizard_0_psxl_0_psx_r52_0a_ctcm_global
              flags: 0
        reserved-memory:
            - rproc0@3ed00000
            - rpu0vdev0vring0@3ed60000
            - rpu0vdev0vring1@3ed64000
            - rpu0vdev0buffer@3ed68000

        domain-to-domain:
            compatible: openamp,domain-to-domain-v1
            remoteproc-relation:
                compatible: openamp,remoteproc-v2
                relation0:
                    remote: openamp_r52_lockstep
                    elfload: [ psx_wizard_0_psxl_0_psx_r52_0a_atcm_global,
                               psx_wizard_0_psxl_0_psx_r52_0a_btcm_global,
                               psx_wizard_0_psxl_0_psx_r52_0a_ctcm_global,
                               rproc0@3ed00000 ]

            rpmsg-relation:
                compatible: openamp,rpmsg-v1
                relation0:
                    remote: openamp_r52_lockstep
                    carveouts: [ rpu0vdev0vring0@3ed60000, rpu0vdev0vring1@3ed64000, rpu0vdev0buffer@3ed68000 ]
                    mbox: ipi_3_to_ipi_1

    openamp_r52_lockstep:
        compatible: openamp,domain-v1
        cpus:
            - cluster: cpus_r52_0
              cpumask: 0x1
              mode:
                  secure: true
                  lockstep: true
        os,type: baremetal
        access:
            - dev: ipi1
              flags: 0
            - dev: psx_wizard_0_psxl_0_psx_r52_0a_atcm_global
              flags: 0
            - dev: psx_wizard_0_psxl_0_psx_r52_0a_btcm_global
              flags: 0
            - dev: psx_wizard_0_psxl_0_psx_r52_0a_ctcm_global
              flags: 0
        reserved-memory:
            - rproc0@3ed00000
            - rpu0vdev0vring0@3ed60000
            - rpu0vdev0vring1@3ed64000
            - rpu0vdev0buffer@3ed68000

        domain-to-domain:
            compatible: openamp,domain-to-domain-v1
            rpmsg-relation:
                compatible: openamp,rpmsg-v1
                relation0:
                    host: openamp_a78_0_cluster
                    carveouts: [ rpu0vdev0vring0@3ed60000, rpu0vdev0vring1@3ed64000, rpu0vdev0buffer@3ed68000 ]
                    mbox: ipi_1_to_ipi_3
