# VEK385: Linux on the APU and one bare-metal MicroBlaze V remote in the PL.
# Apply versal-2ve-2vm-mbv-openamp-overlay.yaml after this base description,
# as done for the RPU with versal-2ve-2vm-multidomain-base.yaml.
# It can be combined with versal-2ve-2vm-multidomain-base.yaml: APU_Linux is
# the same, and MBV_Remote takes id 3, after the RPU domains.
domains:
  APU_Linux:
    compatible: openamp,domain-v1
    id: 0
    cpus:
      - cluster: cpus_a78
        cpumask: 0xff
        mode:
          secure: false
          el: 0x3
    os,type: linux

  MBV_Remote:
    compatible: openamp,domain-v1
    id: 3
    cpus:
      - cluster: cpus_microblaze_riscv_0
        cluster_cpu: microblaze_riscv_0
        cpumask: 0x1
        mode:
          secure: false
    os,type: baremetal
    # The OpenAMP and libmetal demos need more stack and heap than the
    # MicroBlaze defaults; baremetallinker_xlnx writes these for the
    # linker script.
    linker:
      stack_size: 0x4000
      heap_size: 0x4000
