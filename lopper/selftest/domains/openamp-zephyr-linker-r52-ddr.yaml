# Reference metadata for the Zephyr Cortex-R52 DDR-boot sanity test.
reserved-memory:
  ddrboot@9800100:
    start: 0x9800100
    size: 0x5ef00
    mpu-policy!zephyr!append: [ readable, writable, executable, cacheable, static ]
  trace@985f000:
    start: 0x985f000
    size: 0x1000
    mpu-policy!zephyr!append: [ readable, writable, shareable, userspace ]
  rsctbl@9800000:
    mpu-policy!zephyr!append: [ readable, writable, shareable, userspace ]

domains:
  RPU_Zephyr:
    os,type: zephyr
    reserved-memory: [ ddrboot@9800100, trace@985f000, rsctbl@9800000 ]
    linker:
      linker_file_output_name: RPU_ZEPHYR_DDR.ld
      linker_memories: [ ddrboot, rsctbl ]
      entry: _vector_table
      sections:
        vector_table: { region: ddrboot, offset: 0 }
        text: { region: ddrboot }
        rodata: { region: ddrboot }
        data: { region: ddrboot }
        bss: { region: ddrboot }
        noinit: { region: ddrboot }
        heap: { region: ddrboot }
        stack: { region: ddrboot }
        resource_table: { region: rsctbl, offset: 0 }
