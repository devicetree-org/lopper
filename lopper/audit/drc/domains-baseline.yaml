# Domain definition: syntax, semantics and integrity.
#
# Baseline checks that apply to every domain, whatever kind of domain it is.
# See README.md in this directory for how rules are written, how domains are
# selected, and how to run these.
#
# Malformed YAML, and use of keys the specification does not define, are
# caught before this layer by parsing and schema validation, so they are not
# repeated as node checks here.

drc:
  # Every domain must declare itself as one, with "openamp,domain-v1" in its
  # compatible. A domain missing it will be ignored by everything downstream
  # that looks for domains, silently doing nothing.
  #
  # Selection cannot use `compatible`, since that is what is being checked; a
  # node is taken to be a domain if it carries `cpus` or `os,type`, excluding
  # the grouping nodes that also live under /domains.
  - id: domain-compatible
    severity: error
    phase: post-yaml
    select:
      - "/domains/.*:cpus"
      - "/domains/.*:os,type"
      - check: compatible-contains
        params: { token: "openamp,group-v1" }
        negate: true
    check: compatible-contains
    params:
      token: "openamp,domain-v1"
    message: "domain node compatible must include 'openamp,domain-v1'"

  # Every domain must have an `id`. It is how firmware refers to the domain,
  # so a domain without one cannot be addressed at runtime.
  #
  # Selection cannot use `id`, since that is what is being checked.
  - id: domain-id-present
    severity: error
    phase: post-yaml
    select:
      - "/domains/.*:cpus"
      - "/domains/.*:os,type"
      - check: compatible-contains
        params: { token: "openamp,group-v1" }
        negate: true
    check: required
    params:
      properties: ["id"]
    message: "every domain must have a unique 32-bit 'id' property"

  # `os,type` must name an OS the tooling knows how to generate for. An
  # unrecognised value produces no output for that domain.
  - id: domain-os-type
    severity: error
    phase: post-yaml
    select:
      - "/domains/.*:compatible:openamp,domain-v1"
    check: enum
    params:
      property: "os,type"
      values: ["linux", "zephyr", "baremetal", "xen", "freertos"]
    message: "domain 'os,type' must be a recognized OS type"

  # No two domains may share an `id`. Duplicates make the domain that firmware
  # resolves an `id` to ambiguous.
  - id: domain-id-unique
    severity: error
    phase: post-processing
    group-by: "/domains/.*:compatible:openamp,domain-v1"
    collect: "property:id"
    check: exclusive-across
    message: "domain 'id' must be unique across all domains"

  # A domain naming a `parent` must name one that exists. A dangling parent
  # means the intended resource inheritance never happens.
  - id: domain-parent-exists
    severity: error
    phase: post-processing
    select:
      - "/domains/.*:parent"
    check: ref-exists
    params:
      property: "parent"
    message: "domain 'parent' must reference an existing domain"

  # A child domain may only be given devices its parent already has. Claiming
  # more would grant access the parent was never entitled to delegate.
  - id: domain-access-within-parent
    severity: error
    phase: post-processing
    select:
      - "/domains/.*:parent"
    check: subset-of
    params:
      of: access
      relative: parent-domain
    message: "a domain's access must be a subset of its parent's"
